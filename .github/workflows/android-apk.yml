name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      # Same signing key every build, so updates install over the old app (kept in a private cache)
      - name: Restore signing key
        id: key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: gold-signals-signing-key
      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "::error title=Gradle build failed::$(grep -E 'error:|FAILURE|What went wrong|Could not|> ' build.log | head -25 | tr '\n' '|' )"
            exit 1; }
      - name: Save signing key
        if: steps.key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: gold-signals-signing-key
      - name: Publish to the "Android app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GoldSignals.apk
          ls -l GoldSignals.apk
          gh release view android-app >/dev/null 2>&1 || \
            gh release create android-app --title "Gold Signals – Android app" \
              --notes "Install GoldSignals.apk on your Android phone. Direct link: https://github.com/${{ github.repository }}/releases/download/android-app/GoldSignals.apk"
          gh release upload android-app GoldSignals.apk --clobber
          echo "::notice::APK published: https://github.com/${{ github.repository }}/releases/download/android-app/GoldSignals.apk (version 1.0.${{ github.run_number }})"
