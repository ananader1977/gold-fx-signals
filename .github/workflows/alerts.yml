name: Price alerts and demo trading

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay runs by several minutes)
  workflow_dispatch:
    inputs:
      check_only:
        description: "Connection check only (no trades)"
        type: boolean
        default: true
      report:
        description: "Report open positions (stop loss / take profit check)"
        type: boolean
        default: false
      telegram_test:
        description: "Send a Telegram test message"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: price-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
      CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
      CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
      CAPITAL_LIVE_CONFIRM: ${{ secrets.CAPITAL_LIVE_CONFIRM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Telegram test
        if: github.event_name == 'workflow_dispatch' && inputs.telegram_test
        run: python -c "import alert; alert.telegram('Test message from your gold-fx-signals bot. Telegram alerts are working.', strict=True)"
      - name: Position report
        if: github.event_name == 'workflow_dispatch' && inputs.report
        run: python trade.py --report
      - name: Connection check
        if: github.event_name == 'workflow_dispatch' && inputs.check_only
        run: python trade.py --check
      - name: Price alerts
        if: github.event_name == 'schedule' || !inputs.check_only
        run: python alert.py
      - name: Trading
        if: github.event_name == 'schedule' || !inputs.check_only
        run: python trade.py
      - name: Save state
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          for f in state.json trade_state.json equity.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || (git commit -m "Update bot state" && git pull --rebase && git push)

