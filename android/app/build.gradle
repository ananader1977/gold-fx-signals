plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anas.goldsignals'
    compileSdk 35

    defaultConfig {
        applicationId 'com.anas.goldsignals'
        minSdk 26
        targetSdk 35
        def runNumber = System.getenv("GITHUB_RUN_NUMBER") ?: "1"
        versionCode = Integer.parseInt(runNumber)
        versionName = "1.0." + runNumber
    }

    // Fixed signing key (created once by the workflow, kept in a private Actions cache, never committed)
    // so every new APK installs as an update over the previous one.
    def ks = rootProject.file("keystore/gold.jks")
    signingConfigs {
        gold {
            if (ks.exists()) {
                storeFile ks
                storePassword "goldsignals"
                keyAlias "gold"
                keyPassword "goldsignals"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (ks.exists()) signingConfig signingConfigs.gold
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
